<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 980" font-family="Helvetica, Arial, sans-serif">
  <rect width="1180" height="980" fill="#faf9f7"/>
  <text x="590" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#1a1a1a">Draufsicht Heckauszug</text>
  <text x="590" y="58" text-anchor="middle" font-size="13" fill="#555">Blick von oben, Front links, Heckklappe rechts</text>
  <text x="80" y="128" font-size="12" font-weight="700">zur Mittelbank</text>
  <text x="760" y="128" font-size="12" font-weight="700">Heckklappe</text>
  <rect x="200" y="150" width="382" height="651" fill="#f3c7b8" stroke="#b8432a" stroke-width="2.5"/>
  <rect x="275" y="221" width="223" height="404" rx="3" fill="#d9ead3" stroke="#2e7d32" stroke-width="2"/>
  <text x="386" y="400" text-anchor="middle" font-size="15" font-weight="700" fill="#1b5e20">CFX5 95DZ</text>
  <text x="386" y="422" text-anchor="middle" font-size="13" fill="#1b5e20">962 mm quer</text>
  <text x="386" y="442" text-anchor="middle" font-size="13" fill="#1b5e20">530 mm in Fahrtrichtung</text>
  <text x="330" y="640" font-size="11" fill="#1b5e20">50 mm Luft</text>
  <rect x="305" y="654" width="193" height="139" rx="3" fill="#d6e4f0" stroke="#1e4a78" stroke-width="2"/>
  <text x="401" y="712" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a5f">Wasser 20 l</text>
  <text x="401" y="732" text-anchor="middle" font-size="12" fill="#1e3a5f">350 mm quer</text>
  <text x="401" y="750" text-anchor="middle" font-size="12" fill="#1e3a5f">460 mm längs</text>
  <rect x="519" y="158" width="55" height="635" fill="#fff" stroke="#6e2414" stroke-width="1.6"/>
  <text x="546" y="470" text-anchor="middle" font-size="12" font-weight="700" fill="#6e2414" transform="rotate(-90 546 470)">Stirnfach 150 mm, Kocher hochkant, Kartuschen</text>
  <rect x="610" y="300" width="168" height="336" rx="2" fill="none" stroke="#6e2414" stroke-width="1.6" stroke-dasharray="7 4"/>
  <text x="694" y="456" text-anchor="middle" font-size="12" font-weight="700" fill="#6e2414">Arbeitsplatte</text>
  <text x="694" y="476" text-anchor="middle" font-size="11" fill="#6e2414">800 x 400 mm</text>
  <text x="694" y="494" text-anchor="middle" font-size="11" fill="#6e2414">nur aufgeklappt</text>
  <line x1="200" y1="840" x2="582" y2="840" stroke="#b8432a" stroke-width="1.4"/>
  <polygon points="200,840 210,836 210,844" fill="#b8432a"/>
  <polygon points="582,840 572,836 572,844" fill="#b8432a"/>
  <text x="391" y="862" text-anchor="middle" font-size="13" font-weight="700" fill="#b8432a">Heckteil Länge ca. 910 mm</text>
  <line x1="150" y1="150" x2="150" y2="801" stroke="#333" stroke-width="1.4"/>
  <polygon points="150,150 146,160 154,160" fill="#333"/>
  <polygon points="150,801 146,791 154,791" fill="#333"/>
  <text x="128" y="490" transform="rotate(-90 128 490)" font-size="13" font-weight="700">Heckteil Breite ca. 1550 mm</text>
  <text x="590" y="900" text-anchor="middle" font-size="13" fill="#333">962 + 50 + 350 = 1362 mm. Außen bleiben ca. 190 mm für Wand, Führung und Luft auf der Fahrerseite.</text>
  <text x="590" y="922" text-anchor="middle" font-size="13" fill="#333">Der Kanister liegt auf der 350-mm-Seite. Die 460 mm laufen längs, neben den 530 mm der Kühlbox.</text>
  <text x="590" y="948" text-anchor="middle" font-size="11" fill="#888">Unten im Bild = Fahrzeugrechts, Schiebetür. Planwerte, vor dem Zuschnitt die lichte Schubladenbreite messen.</text>
</svg>
