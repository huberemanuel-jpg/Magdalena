<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" font-family="Helvetica, Arial, sans-serif">
  <rect width="900" height="640" fill="#faf9f7"/>
  <text x="450" y="36" text-anchor="middle" font-size="22" font-weight="700">Heckansicht – Zugang von der Heckklappe</text>
  <text x="450" y="58" text-anchor="middle" font-size="13" fill="#555">Blick von hinten ins offene Heck · analog Referenzfoto</text>

  <!-- opening -->
  <rect x="140" y="90" width="620" height="460" rx="8" fill="#f4f1ec" stroke="#222" stroke-width="3"/>
  <text x="450" y="118" text-anchor="middle" font-size="12" fill="#666">Hecköffnung</text>

  <!-- mattress -->
  <rect x="180" y="200" width="540" height="70" rx="6" fill="#3a3a3a" stroke="#111" stroke-width="2"/>
  <text x="450" y="242" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">Matratze / Liege</text>

  <!-- open storage under mattress -->
  <rect x="180" y="280" width="540" height="180" rx="4" fill="#f7f3ee" stroke="#b8432a" stroke-width="3"/>
  <text x="450" y="340" text-anchor="middle" font-size="16" font-weight="700" fill="#6e2414">Stauraum offen zur Heckklappe</text>
  <text x="450" y="368" text-anchor="middle" font-size="13" fill="#6e2414">Auszug oder offenes Fach · Eurobox / Kühlbox / Pack</text>
  <rect x="210" y="390" width="150" height="50" rx="4" fill="#fff" stroke="#b8432a"/>
  <text x="285" y="420" text-anchor="middle" font-size="12">Eurobox</text>
  <rect x="375" y="390" width="150" height="50" rx="4" fill="#fff" stroke="#b8432a"/>
  <text x="450" y="420" text-anchor="middle" font-size="12">Kühlbox</text>
  <rect x="540" y="390" width="150" height="50" rx="4" fill="#fff" stroke="#b8432a"/>
  <text x="615" y="420" text-anchor="middle" font-size="12">Pack</text>

  <!-- sill -->
  <rect x="140" y="520" width="620" height="28" fill="#c23b2e" stroke="#222" stroke-width="2"/>
  <text x="450" y="540" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">Ladekante / Heckklappe unten</text>

  <text x="450" y="590" text-anchor="middle" font-size="12" fill="#444">Oben Liege · darunter Zugriff ohne die Matratze abzuräumen</text>
  <text x="450" y="612" text-anchor="middle" font-size="11" fill="#888">Vorbild: Referenzfoto blauer T3, Bett mit offenem Unterbau</text>
</svg>
