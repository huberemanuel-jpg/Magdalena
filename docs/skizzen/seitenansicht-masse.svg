<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 780" font-family="Helvetica, Arial, sans-serif">
  <rect width="1280" height="780" fill="#faf9f7"/>
  <text x="640" y="32" text-anchor="middle" font-size="22" font-weight="700">Seitenansicht – Planung vorderer Teil</text>
  <text x="640" y="54" text-anchor="middle" font-size="13" fill="#555">Rechte Seite · nur hier ist die Schiebetür · Front links · Maße ca.</text>

  <!-- scale 0.26 px/mm
       cargo 2780 = 723 px, starts x=250
       ceiling y=100, low floor y=100+1465*0.26=481
       engine step 375*0.26=98, engine deck y=481-98=383
       engine length 910*0.26=237, from rear of cargo
       cargo ends x=250+723=973
  -->

  <text x="80" y="88" font-size="12" font-weight="700">← FRONT</text>
  <text x="1120" y="88" font-size="12" font-weight="700">HECK →</text>

  <!-- ceiling and low floor -->
  <line x1="70" y1="110" x2="1040" y2="110" stroke="#222" stroke-width="2.5"/>
  <line x1="70" y1="491" x2="736" y2="491" stroke="#222" stroke-width="3"/>
  <text x="78" y="104" font-size="11" fill="#666">Dachhimmel</text>

  <!-- engine deck, last 910 mm of cargo: x = 973-237 = 736 to 973, y=383 -->
  <path d="M736 491 L736 383 L973 383 L973 491" fill="#d5d5d5" stroke="#555" stroke-width="2"/>
  <text x="854" y="460" text-anchor="middle" font-size="12" font-weight="700" fill="#333">Motorabdeckung</text>
  <text x="854" y="478" text-anchor="middle" font-size="11" fill="#333">ca. 910 × 375 mm</text>

  <!-- front seats, facing LEFT (front). cushion then backrest to its right -->
  <rect x="80" y="390" width="90" height="70" rx="6" fill="#e6e6e6" stroke="#222" stroke-width="2"/>
  <rect x="160" y="330" width="28" height="130" rx="4" fill="#cfcfcf" stroke="#222" stroke-width="2"/>
  <rect x="164" y="308" width="20" height="24" rx="4" fill="#bbb" stroke="#222" stroke-width="1.5"/>
  <text x="125" y="430" text-anchor="middle" font-size="11" font-weight="700">Reihe 1</text>

  <!-- KDO -->
  <rect x="210" y="200" width="36" height="291" fill="#d6e4f0" stroke="#1e4a78" stroke-width="2"/>
  <text x="228" y="340" text-anchor="middle" font-size="11" font-weight="700" fill="#1e3a5f" transform="rotate(-90 228 340)">KDO-Wand</text>

  <!-- middle bench on low floor, facing FRONT (left): cushion left, backrest RIGHT -->
  <rect x="270" y="400" width="150" height="70" rx="6" fill="#e6e6e6" stroke="#222" stroke-width="2.2"/>
  <rect x="410" y="300" width="34" height="170" rx="5" fill="#cfcfcf" stroke="#222" stroke-width="2.2"/>
  <rect x="416" y="274" width="22" height="28" rx="5" fill="#bbb" stroke="#222" stroke-width="1.5"/>
  <text x="345" y="440" text-anchor="middle" font-size="12" font-weight="700">Mittelbank</text>
  <text x="345" y="456" text-anchor="middle" font-size="10" fill="#333">bleibt aufrecht</text>
  <line x1="360" y1="385" x2="290" y2="385" stroke="#1a4a8a" stroke-width="1.6" marker-end="url(#fwd)"/>

  <defs>
    <marker id="fwd" markerWidth="8" markerHeight="8" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#1a4a8a"/>
    </marker>
  </defs>
  <text x="330" y="378" text-anchor="middle" font-size="10" font-weight="700" fill="#1a4a8a">Blick nach vorne</text>

  <!-- level mattress: top is 100mm above platform.
       Platform is 530 above engine deck. Engine deck y=383.
       530*0.26=138, so platform y=383-138=245
       mattress 100*0.26=26, mattress y=245-26=219
       Bed starts just behind backrest x=448, ends at cargo end 973
  -->
  <rect x="448" y="219" width="525" height="26" rx="3" fill="#3a3a3a"/>
  <text x="710" y="237" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">Matratze ca. 100 mm, darüber ca. 460 mm zum Liegen</text>

  <!-- front box part on LOW floor: from x=448 to engine x=736, from platform y=245 down to floor y=491 -->
  <rect x="448" y="245" width="288" height="246" fill="#f6d3b8" stroke="#b8432a" stroke-width="2.5"/>
  <text x="592" y="340" text-anchor="middle" font-size="14" font-weight="700" fill="#6e2414">vorderer Boxteil</text>
  <text x="592" y="362" text-anchor="middle" font-size="12" fill="#6e2414">auf tiefem Boden</text>
  <text x="592" y="384" text-anchor="middle" font-size="12" fill="#6e2414">ca. 980 mm lang</text>
  <text x="592" y="406" text-anchor="middle" font-size="12" fill="#6e2414">Stauraumhöhe ca. 900 mm</text>

  <!-- rear box on engine: x=736 to 973, platform y=245 to engine deck y=383 -->
  <rect x="736" y="245" width="237" height="138" fill="#f3c7b8" stroke="#b8432a" stroke-width="2.5"/>
  <text x="854" y="285" text-anchor="middle" font-size="12" font-weight="700" fill="#6e2414">Heckteil auf Motor</text>
  <text x="854" y="303" text-anchor="middle" font-size="11" fill="#6e2414">910 × 530 mm, Stauraum oben</text>
  <!-- drawer 800 mm = 208 px, from the tail x=973 inward. 150 mm = 39 px -->
  <rect x="765" y="344" width="208" height="39" rx="2" fill="#fff" stroke="#6e2414" stroke-width="1.6"/>
  <text x="869" y="368" text-anchor="middle" font-size="11" font-weight="700" fill="#6e2414">Auszug längs ca. 800 mm</text>

  <!-- Schiebetür rechts. Öffnung 1060×1315 mm, angesetzt am Laderaumanfang (x=250).
       1060*0.26=276, Höhe 1315*0.26=342, Unterkante Boden y=491, Oberkante y=149.
       Hintere Türkante x=526, Box beginnt x=448 → ca. 300 mm der vorderen Box liegen in der Öffnung. -->
  <rect x="250" y="149" width="276" height="342" fill="#1a4a8a" fill-opacity="0.10" stroke="#1a4a8a" stroke-width="2.6" stroke-dasharray="8 4"/>
  <text x="388" y="172" text-anchor="middle" font-size="13" font-weight="700" fill="#1a4a8a">Schiebetür rechts, offen</text>
  <text x="388" y="190" text-anchor="middle" font-size="11" fill="#1a4a8a">Öffnung ca. 1060 × 1315 mm</text>
  <rect x="448" y="245" width="78" height="246" fill="#2e7d32" fill-opacity="0.22" stroke="#1b5e20" stroke-width="1.5"/>
  <text x="487" y="470" text-anchor="middle" font-size="11" font-weight="700" fill="#1b5e20" transform="rotate(-90 487 470)">Türzugang ca. 300 mm</text>

  <!-- Heckteil: Länge 910 mm über der Motorzone, Höhe 530 mm ab Motordeckel -->
  <line x1="736" y1="198" x2="973" y2="198" stroke="#b8432a" stroke-width="1.6"/>
  <line x1="736" y1="198" x2="736" y2="245" stroke="#b8432a" stroke-width="1"/>
  <line x1="973" y1="198" x2="973" y2="245" stroke="#b8432a" stroke-width="1"/>
  <polygon points="736,198 746,194 746,202" fill="#b8432a"/>
  <polygon points="973,198 963,194 963,202" fill="#b8432a"/>
  <text x="854" y="190" text-anchor="middle" font-size="12" font-weight="700" fill="#b8432a">Heckteil Länge ca. 910 mm</text>

  <line x1="1002" y1="245" x2="1002" y2="383" stroke="#b8432a" stroke-width="1.6"/>
  <line x1="973" y1="245" x2="1002" y2="245" stroke="#b8432a" stroke-width="1"/>
  <line x1="973" y1="383" x2="1002" y2="383" stroke="#b8432a" stroke-width="1"/>
  <polygon points="1002,245 998,255 1006,255" fill="#b8432a"/>
  <polygon points="1002,383 998,373 1006,373" fill="#b8432a"/>
  <text x="1016" y="324" transform="rotate(90 1016 324)" font-size="12" font-weight="700" fill="#b8432a">Höhe ca. 530 mm</text>

  <!-- hatch -->
  <path d="M973 110 L1040 190" stroke="#222" stroke-width="2.5" fill="none"/>
  <text x="990" y="180" font-size="11" font-weight="700">Heckklappe</text>

  <!-- dims cargo -->
  <line x1="250" y1="540" x2="973" y2="540" stroke="#333" stroke-width="1.3"/>
  <polygon points="250,540 260,536 260,544" fill="#333"/>
  <polygon points="973,540 963,536 963,544" fill="#333"/>
  <text x="611" y="562" text-anchor="middle" font-size="13" font-weight="700">Laderaum ohne Bänke ca. 2780 mm</text>

  <line x1="250" y1="590" x2="448" y2="590" stroke="#555" stroke-width="1.2"/>
  <polygon points="250,590 260,586 260,594" fill="#555"/>
  <polygon points="448,590 438,586 438,594" fill="#555"/>
  <text x="349" y="612" text-anchor="middle" font-size="12">Mittelbank ca. 890 mm</text>

  <line x1="448" y1="640" x2="973" y2="640" stroke="#b8432a" stroke-width="1.3"/>
  <polygon points="448,640 458,636 458,644" fill="#b8432a"/>
  <polygon points="973,640 963,636 963,644" fill="#b8432a"/>
  <text x="710" y="662" text-anchor="middle" font-size="12" font-weight="700" fill="#8a3218">Liege hinter der Bank ca. 1890 mm</text>

  <line x1="448" y1="700" x2="736" y2="700" stroke="#8a3218" stroke-width="1.2"/>
  <text x="592" y="722" text-anchor="middle" font-size="12" fill="#8a3218">davon vorderer Teil ca. 980 mm</text>

  <!-- height dims -->
  <line x1="40" y1="110" x2="40" y2="491" stroke="#555" stroke-width="1.2"/>
  <polygon points="40,110 36,120 44,120" fill="#555"/>
  <polygon points="40,491 36,481 44,481" fill="#555"/>
  <text x="24" y="310" transform="rotate(-90 24 310)" font-size="12" fill="#333">tiefer Boden bis Himmel ca. 1465</text>

  <line x1="1060" y1="110" x2="1060" y2="383" stroke="#555" stroke-width="1.2"/>
  <polygon points="1060,110 1056,120 1064,120" fill="#555"/>
  <polygon points="1060,383 1056,373 1064,373" fill="#555"/>
  <text x="1076" y="260" transform="rotate(90 1076 260)" font-size="12" fill="#222">Motor bis Himmel ca. 1090</text>

  <text x="640" y="748" text-anchor="middle" font-size="11" fill="#333">Grün: vorderer Boxteil, der bei offener Schiebetür seitlich direkt erreichbar ist. Der Rest des vorderen Teils liegt hinter dem festen Seitenfenster.</text>
  <text x="640" y="766" text-anchor="middle" font-size="11" fill="#888">Türlage angesetzt am Laderaumanfang hinter Reihe 1. Die genaue B-Säule am Bus nachmessen. Linke Seite hat keine Schiebetür.</text>
</svg>
