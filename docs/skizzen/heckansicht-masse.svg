<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 860" font-family="Helvetica, Arial, sans-serif">
  <rect width="1100" height="860" fill="#faf9f7"/>
  <text x="550" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#1a1a1a">Heckansicht – Magdalena, Campingbox</text>
  <text x="550" y="58" text-anchor="middle" font-size="13" fill="#555">Blick von hinten in die offene Heckklappe · Maße ca., Planwerte</text>

  <!-- scale: 0.40 px per mm. Interior 1555 x 1465 → 622 x 586
       origin interior: x=200, y=90 is ceiling, floor at y=90+586=676 -->
  <!-- body shell -->
  <rect x="170" y="70" width="682" height="640" rx="6" fill="none" stroke="#222" stroke-width="3"/>
  <text x="511" y="88" text-anchor="middle" font-size="11" fill="#666">Hecköffnung</text>

  <!-- interior opening inset 15 px (~ wall) -->
  <rect x="200" y="100" width="622" height="586" fill="#f4f1ec" stroke="#888" stroke-width="1.2"/>

  <!-- mattress on platform: platform top at floor - 530mm = 676 - 212 = 464; mattress 100mm = 40px so top at 424 -->
  <rect x="208" y="424" width="606" height="40" rx="3" fill="#3a3a3a"/>
  <text x="511" y="449" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Matratze ca. 100 mm · Liegebreite bis ca. 1550 mm</text>

  <!-- box body under mattress from y=464 to y=676 (212 px = 530 mm) -->
  <rect x="208" y="464" width="606" height="212" fill="#f3c7b8" stroke="#b8432a" stroke-width="2"/>

  <!-- LifeSaver on Schiebetürseite = vehicle right = LEFT of this view
       bay width 380mm = 152 px, height 476mm = 190 px, sitting on floor: top at 676-190=486 -->
  <rect x="216" y="486" width="152" height="182" rx="3" fill="#d6e4f0" stroke="#1e4a78" stroke-width="2"/>
  <text x="292" y="560" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a5f">LifeSaver</text>
  <text x="292" y="578" text-anchor="middle" font-size="11" fill="#1e3a5f">349 × 476</text>
  <text x="292" y="594" text-anchor="middle" font-size="10" fill="#1e3a5f">stehend</text>

  <!-- stove drawer: vehicle left side of opening = RIGHT of view, width 560mm=224px, height 150mm=60px, on floor -->
  <rect x="560" y="608" width="244" height="60" rx="3" fill="#fff" stroke="#6e2414" stroke-width="2"/>
  <text x="682" y="634" text-anchor="middle" font-size="12" font-weight="700" fill="#6e2414">Kocher-Auszug</text>
  <text x="682" y="650" text-anchor="middle" font-size="11" fill="#6e2414">ca. 560 × 150 mm</text>

  <!-- storage above stove drawer, same column, up to platform -->
  <rect x="378" y="472" width="426" height="128" rx="3" fill="#faf0eb" stroke="#b8432a" stroke-width="1.4"/>
  <text x="591" y="530" text-anchor="middle" font-size="13" font-weight="700" fill="#6e2414">Stauraum</text>
  <text x="591" y="548" text-anchor="middle" font-size="11" fill="#6e2414">Eurobox / Kühlbox</text>
  <text x="591" y="566" text-anchor="middle" font-size="11" fill="#6e2414">ca. 1000 × 320 mm</text>

  <!-- small gap column between LS and storage is included in storage start.
       LS is 216-368. Storage starts 378. Stove is 560-804. 
       There's a gap 378-560 above the... wait stove is only at the bottom right.
       Left of stove under the storage should also be storage. I drew storage from 378 covering above stove. Good.
       Area x=378 to 560, y=608 to 668 is NOT the stove (stove starts 560). That's empty in my drawing - should be part of drawer or storage.
       Widen stove drawer to start at 378 so the pull-out is the full width except LifeSaver.
       378 to 804 = 426 px = 1065 mm. Stove needs only 560, rest of drawer can hold gas cartridge.
       Let me fix by overlaying a wider drawer. I'll redraw drawer from 378.
  -->
  <rect x="378" y="608" width="426" height="60" rx="3" fill="#fff" stroke="#6e2414" stroke-width="2"/>
  <text x="500" y="632" text-anchor="middle" font-size="12" font-weight="700" fill="#6e2414">Kocher ca. 490 × 100</text>
  <text x="700" y="632" text-anchor="middle" font-size="12" font-weight="700" fill="#6e2414">Gas</text>
  <text x="591" y="652" text-anchor="middle" font-size="11" fill="#6e2414">Heckauszug, lichte Höhe ca. 150 mm · Breite ca. 1060 mm</text>

  <!-- side labels -->
  <text x="292" y="668" text-anchor="middle" font-size="10" fill="#1e3a5f">rechts · Schiebetür</text>
  <text x="730" y="460" text-anchor="middle" font-size="10" fill="#333">links · Fahrerseite</text>

  <!-- headroom label -->
  <text x="511" y="280" text-anchor="middle" font-size="13" fill="#444">frei über der Matratze ca. 830 mm</text>
  <text x="511" y="300" text-anchor="middle" font-size="12" fill="#777">Innenhöhe gesamt ca. 1465 mm</text>

  <!-- dimension: interior width -->
  <line x1="200" y1="730" x2="822" y2="730" stroke="#333" stroke-width="1.3"/>
  <polygon points="200,730 210,726 210,734" fill="#333"/>
  <polygon points="822,730 812,726 812,734" fill="#333"/>
  <text x="511" y="752" text-anchor="middle" font-size="13" font-weight="700">Innenbreite hinten ca. 1555 mm</text>

  <!-- dimension: box height -->
  <line x1="150" y1="464" x2="150" y2="676" stroke="#b8432a" stroke-width="1.4"/>
  <polygon points="150,464 146,474 154,474" fill="#b8432a"/>
  <polygon points="150,676 146,666 154,666" fill="#b8432a"/>
  <text x="132" y="580" transform="rotate(-90 132 580)" font-size="12" font-weight="700" fill="#b8432a">Box ca. 530</text>

  <!-- dimension: interior height -->
  <line x1="860" y1="100" x2="860" y2="676" stroke="#555" stroke-width="1.3"/>
  <polygon points="860,100 856,110 864,110" fill="#555"/>
  <polygon points="860,676 856,666 864,666" fill="#555"/>
  <text x="878" y="400" transform="rotate(90 878 400)" font-size="12" fill="#333">Innenhöhe ca. 1465 mm</text>

  <!-- load height -->
  <line x1="200" y1="676" x2="822" y2="676" stroke="#222" stroke-width="3"/>
  <text x="210" y="698" font-size="12" fill="#333">Ladekante ca. 820 mm über der Fahrbahn</text>

  <!-- exterior width note -->
  <text x="550" y="800" text-anchor="middle" font-size="12" fill="#444">Außenbreite Syncro ca. 1845 mm · Kocher-Tiefe im Auszug ca. 400 mm · LifeSaver-Tiefe ca. 171 mm</text>
  <text x="550" y="824" text-anchor="middle" font-size="11" fill="#888">Blick von hinten: links im Bild = Fahrzeugrechts (Schiebetür). Maße sind Planwerte, nicht für den Zuschnitt.</text>
</svg>
