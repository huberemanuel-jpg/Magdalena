<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 830" font-family="Helvetica, Arial, sans-serif">
  <rect width="1180" height="830" fill="#faf9f7"/>
  <text x="590" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#1a1a1a">Heckansicht – über der Motorabdeckung</text>
  <text x="590" y="56" text-anchor="middle" font-size="13" fill="#555">Blick von hinten · Boden der Ansicht = Oberkante Motordeckel · Maße ca.</text>

  <!-- scale 0.46 px/mm. Width 1555 → 715. Height above engine 1090 → 501.
       Interior x=210..925, ceiling y=100, engine deck y=601 -->
  <rect x="180" y="78" width="775" height="545" rx="6" fill="none" stroke="#222" stroke-width="3"/>

  <rect x="210" y="100" width="715" height="501" fill="#f4f1ec" stroke="#888" stroke-width="1.2"/>

  <!-- free headroom 460 mm = 212 px, y=100 to 312 -->
  <text x="567" y="190" text-anchor="middle" font-size="15" font-weight="700" fill="#333">frei über der Matratze ca. 460 mm</text>
  <text x="567" y="214" text-anchor="middle" font-size="12" fill="#555">liegen ja. Sitzen zu fünft im Vorzelt</text>

  <!-- mattress 100 mm = 46 px, y=312..358 -->
  <rect x="218" y="312" width="699" height="46" rx="3" fill="#3a3a3a"/>
  <text x="567" y="340" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Matratze ca. 100 mm</text>

  <!-- box 530 mm = 243 px, y=358..601 -->
  <rect x="218" y="358" width="699" height="243" fill="#f3c7b8" stroke="#b8432a" stroke-width="2"/>

  <!-- heavy drawer, cooler 407 mm = 187 px sets the height. Order: can, cooler, stove -->
  <rect x="228" y="414" width="679" height="187" rx="2" fill="none" stroke="#6e2414" stroke-width="1.6"/>

  <rect x="238" y="521" width="150" height="78" rx="3" fill="#d6e4f0" stroke="#1e4a78" stroke-width="2"/>
  <text x="313" y="554" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a5f">Wasser 20 l</text>
  <text x="313" y="572" text-anchor="middle" font-size="11" fill="#1e3a5f">170 mm flach</text>

  <rect x="404" y="422" width="183" height="175" rx="3" fill="#d9ead3" stroke="#2e7d32" stroke-width="2"/>
  <text x="495" y="500" text-anchor="middle" font-size="13" font-weight="700" fill="#1b5e20">Kühlbox</text>
  <text x="495" y="520" text-anchor="middle" font-size="12" fill="#1b5e20">ca. 36 l</text>
  <text x="495" y="538" text-anchor="middle" font-size="11" fill="#1b5e20">407 mm hoch</text>

  <rect x="602" y="530" width="207" height="67" rx="3" fill="#fff" stroke="#6e2414" stroke-width="2"/>
  <text x="705" y="558" text-anchor="middle" font-size="12" font-weight="700" fill="#6e2414">Kocher längs</text>
  <text x="705" y="576" text-anchor="middle" font-size="11" fill="#6e2414">600 mm in der Tiefe</text>

  <!-- Heckteil width: box x=218..917 -->
  <line x1="218" y1="601" x2="218" y2="648" stroke="#b8432a" stroke-width="1"/>
  <line x1="917" y1="601" x2="917" y2="648" stroke="#b8432a" stroke-width="1"/>
  <line x1="218" y1="648" x2="917" y2="648" stroke="#b8432a" stroke-width="1.6"/>
  <polygon points="218,648 228,644 228,652" fill="#b8432a"/>
  <polygon points="917,648 907,644 907,652" fill="#b8432a"/>
  <text x="567" y="668" text-anchor="middle" font-size="13" font-weight="700" fill="#b8432a">Heckteil Breite ca. 1550 mm</text>

  <!-- width dim interior -->
  <line x1="210" y1="692" x2="925" y2="692" stroke="#333" stroke-width="1.3"/>
  <polygon points="210,692 220,688 220,696" fill="#333"/>
  <polygon points="925,692 915,688 915,696" fill="#333"/>
  <text x="567" y="712" text-anchor="middle" font-size="13" font-weight="700">Innenbreite hinten ca. 1555 mm</text>

  <!-- box height dim -->
  <line x1="155" y1="358" x2="155" y2="601" stroke="#b8432a" stroke-width="1.4"/>
  <polygon points="155,358 151,368 159,368" fill="#b8432a"/>
  <polygon points="155,601 151,591 159,591" fill="#b8432a"/>
  <text x="138" y="490" transform="rotate(-90 138 490)" font-size="12" font-weight="700" fill="#b8432a">Heckteil Höhe 530 mm</text>

  <!-- height above engine -->
  <line x1="960" y1="100" x2="960" y2="601" stroke="#555" stroke-width="1.3"/>
  <polygon points="960,100 956,110 964,110" fill="#555"/>
  <polygon points="960,601 956,591 964,591" fill="#555"/>
  <text x="978" y="360" transform="rotate(90 978 360)" font-size="12" font-weight="700" fill="#222">Motordeckel bis Himmel ca. 1090 mm</text>

  <!-- engine bar -->
  <rect x="210" y="601" width="715" height="28" fill="#c8c8c8" stroke="#555" stroke-width="1.5"/>
  <text x="567" y="620" text-anchor="middle" font-size="12" font-weight="700" fill="#333">Oberkante Motorabdeckung · Ladekante hinten ca. 820 mm über der Fahrbahn</text>

  <text x="590" y="736" text-anchor="middle" font-size="12" fill="#444">Heckteil ca. 910 mm lang × 1550 mm breit × 530 mm hoch. Die Länge steht in der Seitenansicht.</text>
  <text x="590" y="756" text-anchor="middle" font-size="12" fill="#444">1465 mm Innenhöhe gelten vom tiefen Laderaumboden. Der Motordeckel liegt ca. 375 mm höher (820 − 445 mm Beladehöhe).</text>
  <text x="590" y="776" text-anchor="middle" font-size="12" fill="#444">1090 = 1465 − 375. Am Bus nachmessen, Syncro-Kabine ist nicht höher als der 2WD.</text>
  <text x="590" y="798" text-anchor="middle" font-size="11" fill="#888">Links im Bild = Fahrzeugrechts (Schiebetür). Planwerte, nicht für den Zuschnitt.</text>
</svg>
