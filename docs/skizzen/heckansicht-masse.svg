<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 820" font-family="Helvetica, Arial, sans-serif">
  <rect width="1180" height="820" fill="#faf9f7"/>
  <text x="590" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#1a1a1a">Heckansicht – über der Motorabdeckung</text>
  <text x="590" y="56" text-anchor="middle" font-size="13" fill="#555">Blick von hinten · Boden der Ansicht = Oberkante Motordeckel · Maße ca.</text>

  <!-- scale 0.46 px/mm. Width 1555 → 715. Height above engine 1090 → 501.
       Interior x=210..925, ceiling y=100, engine deck y=601 -->
  <rect x="180" y="78" width="775" height="545" rx="6" fill="none" stroke="#222" stroke-width="3"/>

  <rect x="210" y="100" width="715" height="501" fill="#f4f1ec" stroke="#888" stroke-width="1.2"/>

  <!-- free headroom 460 mm = 212 px, y=100 to 312 -->
  <text x="567" y="190" text-anchor="middle" font-size="15" font-weight="700" fill="#333">frei über der Matratze ca. 460 mm</text>
  <text x="567" y="214" text-anchor="middle" font-size="12" fill="#555">liegen ja. Sitzen zu fünft im Vorzelt</text>

  <!-- mattress 100 mm = 46 px, y=312..358 -->
  <rect x="218" y="312" width="699" height="46" rx="3" fill="#3a3a3a"/>
  <text x="567" y="340" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Matratze ca. 100 mm</text>

  <!-- box 530 mm = 243 px, y=358..601 -->
  <rect x="218" y="358" width="699" height="243" fill="#f3c7b8" stroke="#b8432a" stroke-width="2"/>

  <rect x="228" y="368" width="679" height="145" rx="3" fill="#faf0eb" stroke="#b8432a" stroke-width="1.4"/>
  <text x="567" y="440" text-anchor="middle" font-size="14" font-weight="700" fill="#6e2414">Stauraum, Euroboxen, Besteck</text>
  <text x="567" y="462" text-anchor="middle" font-size="12" fill="#6e2414">über Kanister und Kocher</text>

  <!-- flat can 170 mm = 78 px, on the engine deck -->
  <rect x="228" y="521" width="161" height="78" rx="3" fill="#d6e4f0" stroke="#1e4a78" stroke-width="2"/>
  <text x="308" y="554" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a5f">Wasser 20 l</text>
  <text x="308" y="572" text-anchor="middle" font-size="11" fill="#1e3a5f">170 mm flach</text>

  <!-- stove bay 150 mm = 69 px -->
  <rect x="404" y="530" width="503" height="69" rx="3" fill="#fff" stroke="#6e2414" stroke-width="2"/>
  <text x="655" y="560" text-anchor="middle" font-size="13" font-weight="700" fill="#6e2414">Doppelkocher, Fach ca. 150 mm</text>
  <text x="655" y="580" text-anchor="middle" font-size="11" fill="#6e2414">Heckauszug, daneben der Kanister</text>

  <!-- width dim -->
  <line x1="210" y1="650" x2="925" y2="650" stroke="#333" stroke-width="1.3"/>
  <polygon points="210,650 220,646 220,654" fill="#333"/>
  <polygon points="925,650 915,646 915,654" fill="#333"/>
  <text x="567" y="672" text-anchor="middle" font-size="13" font-weight="700">Innenbreite hinten ca. 1555 mm</text>

  <!-- box height dim -->
  <line x1="155" y1="358" x2="155" y2="601" stroke="#b8432a" stroke-width="1.4"/>
  <polygon points="155,358 151,368 159,368" fill="#b8432a"/>
  <polygon points="155,601 151,591 159,591" fill="#b8432a"/>
  <text x="138" y="490" transform="rotate(-90 138 490)" font-size="12" font-weight="700" fill="#b8432a">Box ca. 530</text>

  <!-- height above engine -->
  <line x1="960" y1="100" x2="960" y2="601" stroke="#555" stroke-width="1.3"/>
  <polygon points="960,100 956,110 964,110" fill="#555"/>
  <polygon points="960,601 956,591 964,591" fill="#555"/>
  <text x="978" y="360" transform="rotate(90 978 360)" font-size="12" font-weight="700" fill="#222">Motordeckel bis Himmel ca. 1090 mm</text>

  <!-- engine bar -->
  <rect x="210" y="601" width="715" height="28" fill="#c8c8c8" stroke="#555" stroke-width="1.5"/>
  <text x="567" y="620" text-anchor="middle" font-size="12" font-weight="700" fill="#333">Oberkante Motorabdeckung · Ladekante hinten ca. 820 mm über der Fahrbahn</text>

  <text x="590" y="710" text-anchor="middle" font-size="12" fill="#444">1465 mm Innenhöhe gelten vom tiefen Laderaumboden. Der Motordeckel liegt ca. 375 mm höher (820 − 445 mm Beladehöhe).</text>
  <text x="590" y="732" text-anchor="middle" font-size="12" fill="#444">1090 = 1465 − 375. Am Bus nachmessen, Syncro-Kabine ist nicht höher als der 2WD.</text>
  <text x="590" y="758" text-anchor="middle" font-size="11" fill="#888">Links im Bild = Fahrzeugrechts (Schiebetür). Planwerte, nicht für den Zuschnitt.</text>
</svg>
